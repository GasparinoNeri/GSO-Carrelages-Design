<section class="auth-page">

  <div class="auth-card">

    <div class="auth-brand">
      <div class="brand-icon">G</div>

      <div>
        <span class="eyebrow">GSO Carrelages Design</span>
        <h1>Connexion</h1>
        <p>
          Accédez à votre espace client ou administrateur.
        </p>
      </div>
    </div>

    <form
      class="auth-form"
      (ngSubmit)="onLogin()"
    >

      <div class="field-group">
        <label for="email">
          Adresse e-mail
        </label>

        <input
          id="email"
          type="email"
          name="email"
          [(ngModel)]="email"
          placeholder="exemple@email.com"
          autocomplete="email"
          required
        >
      </div>

      <div class="field-group">
        <label for="password">
          Mot de passe
        </label>

        <input
          id="password"
          type="password"
          name="password"
          [(ngModel)]="password"
          placeholder="Votre mot de passe"
          autocomplete="current-password"
          required
        >
      </div>

      @if (errorMessage) {
        <div class="feedback error">
          {{ errorMessage }}
        </div>
      }

      <button
        class="primary-btn"
        type="submit"
      >
        Se connecter
      </button>

      <div class="auth-separator">
        <span>ou</span>
      </div>

      <p class="register-link">
        Pas encore de compte ?

        <a routerLink="/register">
          Créer un compte
        </a>
      </p>

    </form>

  </div>

</section>
